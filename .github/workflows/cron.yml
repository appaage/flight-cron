name: Cron ping (headless browser)

on:
  schedule:
    - cron: '2-59/5 * * * *'   # every 5 minutes, offset from the hour to dodge GitHub's busiest moments
  workflow_dispatch: {}         # lets you trigger it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - run: node ping.js
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
